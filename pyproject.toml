[project]
name = "djgurda"
version = "2.0.5.0"
description = "Telegram bot for transferring media from links into chats"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.25,<4",
    "pydantic-settings>=2.12,<3",
    "yandex-music>=2.2,<3",
    "yt-dlp[default,curl-cffi]>=2025.11",
]

[project.scripts]
djgurda = "djgurda.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djgurda"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Russian user-facing text.

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]


[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "yandex_music", "yandex_music.*"]
ignore_missing_imports = true
