[project]
name = "djgurda"
version = "0.1.3"
description = "Telegram bot for transferring media from links into chats"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.25,<4",
    "pydantic-settings>=2.12,<3",
]

[project.scripts]
djgurda = "djgurda.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djgurda"]
