name: Build and Deploy Cookies Contour

on:
  push:
    branches:
      - cookies
    paths:
      - ".github/workflows/build-cookies.yml"
      - "deploy/compose/compose.cookies.yml"
      - "deploy/compose/compose.cookies-refresh.yml"
      - "deploy/cron/cookies.cron.example"
      - "deploy/cron/run_cookies_extractor.sh"
      - "deploy/cron/run_session_refresher.sh"
      - "deploy/cron/run_refresh_then_extract.sh"
      - "deploy/cron/prepare_firefox_profile.sh"
      - "deploy/docker/cookies-extractor/**"
      - "deploy/docker/cookies-session-refresher/**"
      - "src/cookies_extractor/**"
      - "src/session_refresher/**"
      - "requirements-cookies.txt"
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: "Pull latest cookies images and runtime files on server"
        required: true
        default: true
        type: boolean

concurrency:
  group: cookies-contour-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      extractor_image_ref: ${{ steps.meta.outputs.extractor_image_ref }}
      refresher_image_ref: ${{ steps.meta.outputs.refresher_image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "extractor_image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:cookies" >> "$GITHUB_OUTPUT"
          echo "extractor_image_sha_ref=ghcr.io/${GITHUB_REPOSITORY,,}:cookies-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "refresher_image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:cookies-refresh" >> "$GITHUB_OUTPUT"
          echo "refresher_image_sha_ref=ghcr.io/${GITHUB_REPOSITORY,,}:cookies-refresh-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ steps.meta.outputs.owner_lc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cookies-extractor image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/cookies-extractor/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.extractor_image_ref }}
            ${{ steps.meta.outputs.extractor_image_sha_ref }}
          platforms: linux/amd64

      - name: Build and push cookies-session-refresher image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/cookies-session-refresher/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.refresher_image_ref }}
            ${{ steps.meta.outputs.refresher_image_sha_ref }}
          platforms: linux/amd64

  deploy_to_server:
    needs: build_and_push
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy cookies runtime files to server staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 228
          source: >-
            deploy/compose/compose.cookies.yml,
            deploy/compose/compose.cookies-refresh.yml,
            deploy/cron/cookies.cron.example,
            deploy/cron/run_cookies_extractor.sh,
            deploy/cron/run_session_refresher.sh,
            deploy/cron/run_refresh_then_extract.sh,
            deploy/cron/prepare_firefox_profile.sh
          target: "/tmp/djgurda-cookies-${{ github.run_id }}-${{ github.run_attempt }}"
          overwrite: true
          strip_components: 0

      - name: Prepare standalone cookies runtime on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 228
          script_stop: true
          script: |
            set -euo pipefail

            STAGING_ROOT="/tmp/djgurda-cookies-${{ github.run_id }}-${{ github.run_attempt }}"
            EXTRACTOR_ROOT="${HOME}/cookies"
            RUNTIME_DIR="${EXTRACTOR_ROOT}/runtime"
            EXTRACTOR_COMPOSE_FILE="${RUNTIME_DIR}/compose.cookies.yml"
            REFRESH_COMPOSE_FILE="${RUNTIME_DIR}/compose.cookies-refresh.yml"
            EXTRACTOR_RUN_SCRIPT="${RUNTIME_DIR}/run_cookies_extractor.sh"
            REFRESH_RUN_SCRIPT="${RUNTIME_DIR}/run_session_refresher.sh"
            PIPELINE_RUN_SCRIPT="${RUNTIME_DIR}/run_refresh_then_extract.sh"
            PREPARE_PROFILE_SCRIPT="${RUNTIME_DIR}/prepare_firefox_profile.sh"
            CRON_EXAMPLE_FILE="${RUNTIME_DIR}/cookies.cron.example"
            EXTRACTOR_IMAGE_REF="${{ needs.build_and_push.outputs.extractor_image_ref }}"
            REFRESH_IMAGE_REF="${{ needs.build_and_push.outputs.refresher_image_ref }}"

            cleanup_staging() {
              rm -rf "$STAGING_ROOT"
            }
            trap cleanup_staging EXIT

            mkdir -p "$RUNTIME_DIR" "$HOME/logs" "$HOME/firefox_profile"
            mkdir -p "$EXTRACTOR_ROOT/YouTube" "$EXTRACTOR_ROOT/VK" "$EXTRACTOR_ROOT/Instagram" "$EXTRACTOR_ROOT/TikTok" "$EXTRACTOR_ROOT/Coub"

            cp -f "$STAGING_ROOT/deploy/compose/compose.cookies.yml" "$EXTRACTOR_COMPOSE_FILE"
            cp -f "$STAGING_ROOT/deploy/compose/compose.cookies-refresh.yml" "$REFRESH_COMPOSE_FILE"
            cp -f "$STAGING_ROOT/deploy/cron/run_cookies_extractor.sh" "$EXTRACTOR_RUN_SCRIPT"
            cp -f "$STAGING_ROOT/deploy/cron/run_session_refresher.sh" "$REFRESH_RUN_SCRIPT"
            cp -f "$STAGING_ROOT/deploy/cron/run_refresh_then_extract.sh" "$PIPELINE_RUN_SCRIPT"
            cp -f "$STAGING_ROOT/deploy/cron/prepare_firefox_profile.sh" "$PREPARE_PROFILE_SCRIPT"
            cp -f "$STAGING_ROOT/deploy/cron/cookies.cron.example" "$CRON_EXAMPLE_FILE"
            chmod +x "$EXTRACTOR_RUN_SCRIPT" "$REFRESH_RUN_SCRIPT" "$PIPELINE_RUN_SCRIPT" "$PREPARE_PROFILE_SCRIPT"

            if [[ -z "${{ secrets.GHCR_PAT }}" ]]; then
              echo "Missing GHCR_PAT secret. Create a PAT with at least read:packages scope." >&2
              exit 1
            fi

            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            if [[ -z "$GHCR_USERNAME" ]]; then
              GHCR_USERNAME="${{ needs.build_and_push.outputs.owner_lc }}"
            fi

            docker logout ghcr.io || true
            if ! echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; then
              echo "GHCR login failed. Check GHCR_USERNAME and GHCR_PAT scopes (recommended: read:packages + repo for private repo)." >&2
              exit 1
            fi

            /usr/bin/docker pull "$EXTRACTOR_IMAGE_REF"
            /usr/bin/docker pull "$REFRESH_IMAGE_REF"
            COOKIES_IMAGE="$EXTRACTOR_IMAGE_REF" /usr/bin/docker compose -f "$EXTRACTOR_COMPOSE_FILE" config > /dev/null
            COOKIES_REFRESH_IMAGE="$REFRESH_IMAGE_REF" /usr/bin/docker compose -f "$REFRESH_COMPOSE_FILE" config > /dev/null

            echo "cookies runtime is ready"
            echo "extractor image: $EXTRACTOR_IMAGE_REF"
            echo "refresher image: $REFRESH_IMAGE_REF"
            echo "runtime path: $RUNTIME_DIR"
