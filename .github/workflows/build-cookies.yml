name: Build and Deploy Cookies Extractor

on:
  push:
    branches:
      - cookies
    paths:
      - ".github/workflows/build-cookies.yml"
      - "deploy/compose/compose.cookies.yml"
      - "deploy/cron/run_cookies_extractor.sh"
      - "deploy/docker/cookies-extractor/**"
      - "src/cookies_extractor/**"
      - "requirements-cookies.txt"
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: "Pull latest cookies image on server"
        required: true
        default: true
        type: boolean

concurrency:
  group: cookies-extractor-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:cookies" >> "$GITHUB_OUTPUT"
          echo "image_sha_ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.meta.outputs.owner_lc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cookies-extractor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/cookies-extractor/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_sha_ref }}
          platforms: linux/amd64

  deploy_to_server:
    needs: build_and_push
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy cookies runtime files to server staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 228
          source: "deploy/compose/compose.cookies.yml,deploy/cron/run_cookies_extractor.sh"
          target: "/tmp/djgurda-cookies-${{ github.run_id }}-${{ github.run_attempt }}"
          overwrite: true
          strip_components: 0

      - name: Prepare standalone cookies runtime on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 228
          script_stop: true
          script: |
            set -euo pipefail

            STAGING_ROOT="/tmp/djgurda-cookies-${{ github.run_id }}-${{ github.run_attempt }}"
            EXTRACTOR_ROOT="${HOME}/cookies"
            RUNTIME_DIR="${EXTRACTOR_ROOT}/runtime"
            COMPOSE_FILE="${RUNTIME_DIR}/compose.cookies.yml"
            RUN_SCRIPT="${RUNTIME_DIR}/run_cookies_extractor.sh"
            IMAGE_REF="${{ needs.build_and_push.outputs.image_ref }}"

            cleanup_staging() {
              rm -rf "$STAGING_ROOT"
            }
            trap cleanup_staging EXIT

            mkdir -p "$RUNTIME_DIR" "$HOME/logs" "$HOME/firefox_profile"
            mkdir -p "$EXTRACTOR_ROOT/YouTube" "$EXTRACTOR_ROOT/VK" "$EXTRACTOR_ROOT/Instagram" "$EXTRACTOR_ROOT/TikTok" "$EXTRACTOR_ROOT/Coub"

            cp -f "$STAGING_ROOT/deploy/compose/compose.cookies.yml" "$COMPOSE_FILE"
            cp -f "$STAGING_ROOT/deploy/cron/run_cookies_extractor.sh" "$RUN_SCRIPT"
            chmod +x "$RUN_SCRIPT"

            if [[ -z "${{ secrets.GHCR_PAT }}" ]]; then
              echo "Missing GHCR_PAT secret. Create a PAT with at least read:packages scope." >&2
              exit 1
            fi

            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            if [[ -z "$GHCR_USERNAME" ]]; then
              GHCR_USERNAME="${{ needs.build_and_push.outputs.owner_lc }}"
            fi

            docker logout ghcr.io || true
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            /usr/bin/docker pull "$IMAGE_REF"
            COOKIES_IMAGE="$IMAGE_REF" /usr/bin/docker compose -f "$COMPOSE_FILE" config > /dev/null

            echo "cookies-extractor image is ready: $IMAGE_REF"
            echo "runtime path: $RUNTIME_DIR"
