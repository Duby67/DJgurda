name: PR checks

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check PR direction
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as file:
              event = json.load(file)
          pr = event['pull_request']
          base, head = pr['base']['ref'], pr['head']['ref']
          if base == 'main':
              allowed = head == 'development' and pr['head']['repo']['full_name'] == event['repository']['full_name']
              message = 'PR to main must come from development in this repository'
          else:
              allowed = base == 'development' and head not in ('main', 'production')
              message = 'PR to development must not come from main or production'
          if not allowed:
              raise SystemExit(message)
          print('PR direction: OK')
          PY

  version-check:
    name: version-check
    if: github.base_ref == 'development'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version increase and matching lockfile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/check_version.py "$BASE_SHA"

  tests:
    name: tests
    if: github.base_ref == 'development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.0'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q
