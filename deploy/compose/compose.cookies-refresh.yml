services:
  cookies-session-refresher:
    container_name: DJgurda-cookies
    image: ${COOKIES_REFRESH_IMAGE:-ghcr.io/duby67/djgurda:cookies-refresh}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      REFRESH_FIREFOX_PROFILE: /session_refresher/firefox_profile
      REFRESH_FIREFOX_BIN: /usr/bin/firefox
      REFRESH_TARGETS: ${REFRESH_TARGETS:-https://www.youtube.com}
      REFRESH_URL_DURATION_MIN: ${REFRESH_URL_DURATION_MIN:-30}
      REFRESH_URL_DURATION_MAX: ${REFRESH_URL_DURATION_MAX:-45}
      REFRESH_HEARTBEAT_SECONDS: ${REFRESH_HEARTBEAT_SECONDS:-15}
      REFRESH_WARMUP_SECONDS: 3
      REFRESH_DISPLAY: :99
      REFRESH_XVFB_SCREEN: 800x600x16
      HOME: /home/DJgurda
      XDG_CACHE_HOME: /home/DJgurda/.cache
      MOZ_DISABLE_CONTENT_SANDBOX: "1"
    volumes:
      - ${SELENIUM_PROFILE_DIR:-/home/DJgurda/firefox_selenium_profile}:/session_refresher/firefox_profile:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    security_opt:
      - seccomp=unconfined
    restart: "no"
