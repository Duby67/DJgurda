services:
  cookies-extractor:
    image: ${COOKIES_IMAGE:-ghcr.io/duby67/djgurda:cookies}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COOKIES_BROWSER: firefox
      COOKIES_BROWSER_PROFILE: /cookies_extractor/firefox_profile
      COOKIES_OUTPUT_DIR: /cookies_extractor/cookies
      COOKIES_TARGETS: youtube,vk,instagram,tiktok,coub
      COOKIES_MIN_COOKIES: 1
    volumes:
      - ${HOME}/cookies:/cookies_extractor/cookies:rw
      - ${HOME}/firefox_profile:/cookies_extractor/firefox_profile:ro
    restart: "no"
