version: "3.9"
services:
  cookies-extractor:
    build:
      context: ../..
      dockerfile: deploy/docker/cookies-extractor/Dockerfile
    env_file:
      - ./.env.cookies
    environment:
      COOKIES_OUTPUT_DIR: /cookies_extractor/cookies
    volumes:
      - ${HOME}/cookies:/cookies_extractor/cookies:rw
      - ${HOME}/firefox-profile:/cookies_extractor/firefox_profile:ro
    restart: "no"
