name: djgurda-local
services:
  bot:
    build:
      context: ../..
      dockerfile: deploy/bot/Dockerfile
    pull_policy: never
    cpus: 1.0
    mem_limit: 1280m
    memswap_limit: 1280m
    # Runs as the host user so the bind-mounted .data/ stays writable.
    user: ${LOCAL_USER:?Start through scripts/local.sh}
    volumes:
      - ../../.data:/data
