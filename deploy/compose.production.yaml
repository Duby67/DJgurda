name: djgurda-production
services:
  bot:
    environment:
      APP_ENV: production
    restart: unless-stopped
    cpus: 0.85
    cpu_shares: 1024
    mem_limit: 1024m
    memswap_limit: 1024m
  bot-api:
    restart: unless-stopped
    cpus: 0.50
    cpu_shares: 1024
    mem_limit: 256m
    memswap_limit: 256m
