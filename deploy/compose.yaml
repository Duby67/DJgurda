services:
  bot:
    image: ${DJGURDA_IMAGE:?Set DJGURDA_IMAGE to the image tag or digest}
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN for this environment}
      ADMIN_IDS: ${ADMIN_IDS:?Set ADMIN_IDS to a nonempty JSON array of administrator IDs}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN:-}  # Optional: Yandex Music downloads.
      BOT_API_URL: http://bot-api:8081
      DATABASE_PATH: /data/djgurda.sqlite3
      WORK_DIR: /data/work
    volumes:
      - data:/data
    depends_on:
      bot-api:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/djgurda-ready"]
      interval: 5s
      timeout: 2s
      start_period: 90s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  bot-api:
    image: ${BOT_API_IMAGE:?Set BOT_API_IMAGE to the Bot API image tag or digest}
    command:
      - --local  # Uploads up to 2000 MB, read by file:// path from the shared volume.
      - --http-port=8081
      - --http-stat-ip-address=127.0.0.1
      - --http-stat-port=8082
      - --dir=/var/lib/telegram-bot-api
      - --temp-dir=/tmp
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID from my.telegram.org}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH from my.telegram.org}
    volumes:
      - data:/data:ro
      - bot-api:/var/lib/telegram-bot-api
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/"]
      interval: 5s
      timeout: 2s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777  # Small multipart uploads such as covers.
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  data:
  bot-api:
